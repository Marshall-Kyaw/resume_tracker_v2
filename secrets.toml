# Copy this file to .streamlit/secrets.toml and fill in your own values.
# NEVER commit the real secrets.toml to a public GitHub repo.
# (When deployed on Community Cloud, paste this same content into the
# app's "Secrets" settings panel instead of using a file.)

[auth]
# Any random long string — used to encrypt the login cookie. Generate one with:
#   python -c "import secrets; print(secrets.token_hex(32))"
cookie_secret = "REPLACE_WITH_A_RANDOM_SECRET"

# Must exactly match an "Authorized redirect URI" on your Google OAuth client.
# Local dev:
redirect_uri = "http://localhost:8501/oauth2callback"
# Once deployed on Community Cloud, switch to (and add this URI in Google
# Cloud Console too):
# redirect_uri = "https://your-app-name.streamlit.app/oauth2callback"

[auth.google]
client_id = "REPLACE_WITH_YOUR_CLIENT_ID.apps.googleusercontent.com"
client_secret = "REPLACE_WITH_YOUR_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[connections.postgresql]
# Get this from Supabase: Project Settings -> Database -> Connection string.
# Use the "Session pooler" string (NOT "Direct connection" — that one is
# IPv6-only and will fail to connect from most hosts, including Streamlit
# Community Cloud). The session pooler is IPv4-compatible and meant for
# exactly this kind of long-running app.
#
# Format looks like:
#   postgresql://postgres.xxxxxxxxxxxx:[YOUR-PASSWORD]@aws-0-REGION.pooler.supabase.com:5432/postgres
url = "REPLACE_WITH_YOUR_SUPABASE_SESSION_POOLER_URL"
